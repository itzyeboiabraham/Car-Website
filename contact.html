<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <title>Contact - ASLcars</title>
</head>
<body>
    
<header class="header">

    <div id="menu-btn" class="fas fa-bars"></div>

    <a href="index.html" class="logo"> <span>ASL</span>cars </a>

    <nav class="navbar">
        <a href="index.html">home</a>
        <a href="vehicles.html">vehicles</a>
        <a href="services.html">services</a>
        <a href="reviews.html">reviews</a>
        <a href="contact.html" class="active">contact</a>
    </nav>

</header> 

<main class="page-main">

<section class="contact" id="contact">

    <h1 class="heading"><span>contact</span> us</h1>

    <div class="row">

        <div class="info-container">
            <h3>contact info</h3>
            <a href="#"> <i class="fas fa-phone"></i> 0596274392 </a>
            <a href="#"> <i class="fas fa-envelope"></i> aslcars@gmail.com </a>
            <a href="#"> <i class="fas fa-map-marker-alt"></i> Tema </a>

            <h3>socials</h3>
            <a href="#"> <i class="fab fa-facebook-f"></i> facebook </a>
            <a href="#"> <i class="fab fa-twitter"></i> twitter </a>
            <a href="#"> <i class="fab fa-instagram"></i> instagram </a>
            <a href="#"> <i class="fab fa-linkedin"></i> linkedin </a>
            <a href="#"> <i class="fab fa-pinterest"></i> pinterest </a>
        </div>

        <form action="">
            <h3>get in touch</h3>
            <input type="text" placeholder="your name" class="box">
            <input type="email" placeholder="your email" class="box">
            <textarea placeholder="your message" class="box" cols="30" rows="10"></textarea>
            <button type="submit" class="btn">send message <i class="fa-solid fa-paper-plane"></i></button>
        </form>

    </div>

</section>

</main>

<footer>
    <div class="credit"> created by <span>Abraham, Samir & Lawerence</span></div>
</footer>


<script src="js/script.js"></script>

</html>
